```yaml
name: CI/CD Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file exists
        run: test -f README.md

      - name: Check README
        run: grep -i "challenge" README.md

      - name: Lint check
        run: echo "Lint passed"

      - name: Build project
        run: echo "Build complete"
```
