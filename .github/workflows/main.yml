
name: CI/CD Test

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check file exists
        run: test -f README.md

      - name: Check README
        run: grep -i "challenge" README.md

      - name: Lint check
        run: |
          npx --yes markdownlint-cli2 README.md

      - name: Build project
        run: |
          npx --yes marked README.md -o README.html
          test -s README.html
